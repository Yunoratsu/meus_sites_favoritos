<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Anatomia de um cartão: nome, imagem, fonte e link" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="440" rx="24" fill="#0b0e1c"/>
  <rect x="48" y="36" width="284" height="368" rx="28" fill="#ffffff" fill-opacity="0.05" stroke="#e62117" stroke-opacity="0.7"/>
  <text x="190" y="100" text-anchor="middle" font-size="28" font-weight="800" fill="#eef0ff">YouTube</text>
  <rect x="72" y="124" width="236" height="132" rx="20" fill="#f4f5ff"/>
  <circle cx="190" cy="190" r="30" fill="#e62117"/>
