  <text x="190" y="290" text-anchor="middle" font-size="14" fill="#9aa1c7">Fonte: (YouTube, 2026)</text>
  <rect x="104" y="326" width="172" height="40" rx="20" fill="#e62117" fill-opacity="0.25" stroke="#e62117"/>
  <text x="190" y="351" text-anchor="middle" font-size="15" font-weight="600" fill="#eef0ff">Visitar YouTube</text>
  <line x1="332" y1="96" x2="430" y2="96" stroke="#9aa1c7" stroke-opacity="0.5" stroke-dasharray="4 4"/>
