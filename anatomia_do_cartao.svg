  <text x="486" y="116" font-size="15" fill="#9aa1c7" font-family="Consolas, 'Courier New', monospace">&lt;h1&gt;</text>
  <line x1="332" y1="190" x2="430" y2="190" stroke="#9aa1c7" stroke-opacity="0.5" stroke-dasharray="4 4"/>
  <circle cx="454" cy="190" r="16" fill="#4f46e5"/>
  <text x="454" y="195" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
  <text x="486" y="188" font-size="19" font-weight="700" fill="#eef0ff">Imagem clicável</text>
  <text x="486" y="210" font-size="15" fill="#9aa1c7" font-family="Consolas, 'Courier New', monospace">&lt;a&gt; + &lt;img&gt;</text>
  <line x1="332" y1="292" x2="430" y2="292" stroke="#9aa1c7" stroke-opacity="0.5" stroke-dasharray="4 4"/>
