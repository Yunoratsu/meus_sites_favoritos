  <text x="486" y="312" font-size="15" fill="#9aa1c7" font-family="Consolas, 'Courier New', monospace">&lt;figcaption&gt;</text>
  <line x1="332" y1="352" x2="430" y2="352" stroke="#9aa1c7" stroke-opacity="0.5" stroke-dasharray="4 4"/>
  <circle cx="454" cy="352" r="16" fill="#4f46e5"/>
